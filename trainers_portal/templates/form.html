<style>
    body{
        background-color: azure;
    }

    .center{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .fieldcard{
        margin: 10px;
        padding: 15px;
    }

    .fieldtext{
        font-size: 30px;
    }

    input{
        height: 35px;
        width: 400px;
        font-size: 25px;
        padding: 3px;
    }

    button{
        font-size: 20px;
        height: 50px;
        width: 180px;
        cursor: pointer; 
        border-radius: 10px;       
    }

    button:hover{
        background-color: green;
        color: white;
    }

    .heading{
        margin-bottom: 10px;
        font-size: 60px;
    }

    .maincard{
        width: 700px;
        padding: 30px;
        margin-top: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        background-color: aliceblue;
    }
</style>

<div class="center">
    <h1 class="center heading">{{ title }}</h1>
    
    <div class="maincard">
        <form method="POST" class="center">
            {% csrf_token %}
            
            {% for field in form %}
                
                <div class="center fieldcard">
                    <label for="" class="fieldtext">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>

            {% endfor %}     
            {{ form.non_field_errors }}
            <button type="submit">{{ operation }}</button>
        </form>
    </div>

</div>
